user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 16M;

    upstream licman_backend  { server backend:8001;  keepalive 32; }
    upstream licman_frontend { server frontend:80;   keepalive 32; }

    # ---------- HTTP (always on, no redirect — RHEL LAN install) ----------
    server {
        listen 80 default_server;
        server_name _;

        # /api -> FastAPI
        location /api/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://licman_backend;
            proxy_read_timeout 120s;
            proxy_buffering off;
        }

        # / -> React static
        location / {
            proxy_set_header Host $host;
            proxy_pass http://licman_frontend;
        }
    }

    # ---------- HTTPS (self-signed by default; replace certs to use your CA) ----------
    server {
        listen 443 ssl;
        http2  on;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location /api/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://licman_backend;
            proxy_read_timeout 120s;
            proxy_buffering off;
        }

        location / {
            proxy_set_header Host $host;
            proxy_pass http://licman_frontend;
        }
    }
}
